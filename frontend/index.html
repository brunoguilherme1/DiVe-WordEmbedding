<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        input {
            padding: 10px;
            margin: 5px;
            width: 80px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Iris Species Prediction</h1>
    <p>Enter flower measurements:</p>
    
    <input type="number" id="sepal_length" placeholder="Sepal Length">
    <input type="number" id="sepal_width" placeholder="Sepal Width">
    <input type="number" id="petal_length" placeholder="Petal Length">
    <input type="number" id="petal_width" placeholder="Petal Width">
    <br>
    <button onclick="predict()">Predict</button>
    
    <p id="result"></p>

    <script>
        async function predict() {
            const sepal_length = document.getElementById("sepal_length").value;
            const sepal_width = document.getElementById("sepal_width").value;
            const petal_length = document.getElementById("petal_length").value;
            const petal_width = document.getElementById("petal_width").value;

            const data = { features: [parseFloat(sepal_length), parseFloat(sepal_width), parseFloat(petal_length), parseFloat(petal_width)] };

            const response = await fetch("http://34.133.192.76/predict/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });

            const result = await response.json();
            document.getElementById("result").innerText = "Prediction: " + result.prediction;
        }
    </script>
</body>
</html>
